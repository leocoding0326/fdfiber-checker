<!DOCTYPE html>
<html lang="en">
<head>
    <!--File Links-->
    <link rel="stylesheet" href="./style.css">
    <script type= 'module' src=./app.js></script>
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fort Dodge Fiber Address Checker</title>
</head>
<body>
    <main>
        <div class="titles">
            <h1>Fort Dodge Fiber Address Checker</h1>
            <p>Check Addresses Cabinets and MST Connections</p>
        </div>
            <form id="search-bar">
                <div class="input-wrap">
                    <i class="fa-solid fa-magnifying-glass" style="color: rgb(105, 157, 157);"></i>
                    <input type="text" id="address-input" placeholder="Enter Address" aria-label="check-address">
                    <i class="fa-solid fa-circle-xmark" style="color: #699d9d;"></i>
                </div>
                <ul id="suggestions">
                </ul>
            </form>
    </main>
</body>
</html>
