<!DOCTYPE html>
<html lang="en">
<head>
    <!--File Links-->
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/main.css">
    <script type= 'module' src="./src/dom/search-bar-dom.js"></script>
    <!--Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fort Dodge Fiber Address Checker</title>
</head>
<body class="main-page-body">
    <main>
        <div class="titles">
            <h1>Fort Dodge Fiber Address Checker</h1>
            <p>Check Addresses Cabinets and MST Connections</p>
        </div>
            <form id="search-bar">
                <p class="error-msg"></p>
                <div class="input-wrap">
                    <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <input type="text" id="address-input" class="input-style" placeholder="Enter Address" aria-label="check-address">
                    <button class="clear-btn hidden"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
                <ul id="suggestions" class="hidden">
                </ul>
            </form>
            <div class="info-display hidden">
            </div>
    </main>
</body>
</html>
